name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v1.2.2'
        required: true
        default: 'v1.2.2'

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub release with the installable tgz
    runs-on: ubuntu-latest
    steps:
      - name: Check out the release ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify the tag matches the package version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "tag=${TAG} package=v${PKG_VERSION}"
          if [ "${TAG}" != "v${PKG_VERSION}" ]; then
            echo "::error::release tag ${TAG} does not match package.json version v${PKG_VERSION}; bump the version and tag it together"
            exit 1
          fi

      - name: Pack the plugin bundle
        run: npm pack --pack-destination ./dist

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          echo "Packing for $TAG"
          ls -la ./dist
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; uploading asset over it"
            gh release upload "$TAG" ./dist/*.tgz --clobber
          else
            gh release create "$TAG" ./dist/*.tgz \
              --title "$TAG" \
              --generate-notes
          fi
